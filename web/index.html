<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<title>Расписание 10503126</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
  // Скрипт Telegram грузим только внутри Telegram: в обычном браузере он не нужен
  (function () {
    var inTg = /tgWebApp/.test(location.hash);
    try { inTg = inTg || !!sessionStorage.getItem('__telegram__initParams'); } catch (e) {}
    if (inTg) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
  })();
</script>
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="row">
      <button class="pill" id="openTasks" type="button" aria-haspopup="dialog" aria-label="Задания">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 8h6"/></svg>
        <span>Задания</span><b class="badge" id="tasksBadge" hidden></b>
      </button>
      <button class="pill" id="openSettings" type="button" aria-haspopup="dialog" data-open="settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span id="prefsLabel">Подгруппа</span>
      </button>
    </div>
    <h1><span id="dayName">Расписание</span><span class="rel" id="rel" hidden></span></h1>
    <p class="sub"><span id="dayDate"></span><span class="dot">·</span><span id="weekNo"></span><span class="adm" id="adm" hidden>староста</span></p>
  </header>

  <nav class="weeknav" aria-label="Дни недели">
    <div class="head">
      <button class="arrow" id="prevWeek" type="button" aria-label="Предыдущая неделя">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="range" id="range" type="button" title="Вернуться к сегодня"></button>
      <button class="arrow" id="nextWeek" type="button" aria-label="Следующая неделя">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="strip" id="strip"></div>
  </nav>

  <section id="status" aria-live="polite"></section>
  <section id="setup"></section>
  <main class="list" id="list"></main>
  <footer class="foot" id="foot"></footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="panel">
    <div class="grab"></div>
    <div id="sheetContent"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
